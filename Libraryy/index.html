<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <div class="container">
        <h1 class="title">My Library</h1>
        <button class="new-book-btn">Add New Book</button>
        
        
        <div class="library-display"></div>

        <dialog class="book-dialog">
            <form class="book-form">
                <h2>Add New Book</h2>
                
                <label for="title">Title:</label>
                <input type="text" class="book-title" name="title" required>
                
                <label for="author">Author:</label>
                <input type="text" class="author" name="author" required>

                <label for="pages">Number of Pages:</label>
                <input type="number" class="pages" name="pages" required>

                <label for="read">Have you read this book (⓿_⓿)?</label>
                <input type="checkbox" class="read" name="read">
                <div class="form-buttons">
                    <button type="submit">Add Book</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </dialog>
    </div>

    <script src="script.js"></script>
</body>
</html>
